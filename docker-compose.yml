name: ${PWD}

services:

  psqlx:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./psqlx-var-lib-postgresql-data-pgdata:/var/lib/postgresql/data/pgdata
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata

  fix-perms:
    image: alpine
    command: sh -c "chown -R 5050:5050 /var/lib/pgadmin && chown -R 100:100 /var/lib/odoo && chown 100:100 /etc/odoo/odoo.conf"
    volumes:
      - ./pgadminx-var-lib-pgadmin:/var/lib/pgadmin
      - ./odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf

  pgadminx:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=nimdasx@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ./pgadminx-var-lib-pgadmin:/var/lib/pgadmin
      - ./pgadminx-servers.json:/pgadmin4/servers.json:ro

  odoo:
    # TODO: ganti ke "image: odoo:20" setelah image resmi rilis di Docker Hub.
    # Sementara pakai image hasil build ../odoo_docker_image/build.sh
    image: odoo20-local
    restart: unless-stopped
    ports:
      - ${ODOO_PORT}:8069
    depends_on:
      psqlx:
        condition: service_started
      fix-perms:
        condition: service_completed_successfully
    volumes:
      - ../odoo/odoo:/usr/lib/python3/dist-packages/odoo
      - ../odoo/addons:/usr/lib/python3/dist-packages/addons
      - ../odoo_addon_official:/mnt/odoo_addon_official
      - ../odoo_addon_shared:/mnt/odoo_addon_shared
      # TODO: masih kosong, belum masuk addons_path di odoo.conf
      - ../odoo_addon_shared_multi:/mnt/odoo_addon_shared_multi
      - ./source:/mnt/extra-addons
      - ./odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=psqlx
      - PORT=5432
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
